<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Analyzer</title>
<style>body{font:17px system-ui;background:#f3f6fa;color:#192636;max-width:760px;margin:48px auto;padding:0 20px}main{background:white;padding:30px;border-radius:16px;box-shadow:0 8px 35px #20305012}h1{margin-top:0}label{display:block;margin:20px 0 8px}textarea,input[type=number]{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aeb9c7;border-radius:6px;font:inherit}textarea{min-height:160px}button{font:inherit;background:#155bc6;color:white;border:0;border-radius:7px;padding:12px 24px;margin-top:24px;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f9;padding:18px;border-radius:8px}small{color:#526173}a{color:#155bc6}</style>
<main><h1>Text Analyzer</h1><p>Count words and characters, estimate reading time, and optionally list word frequencies.</p>
<form id="form"><label for="text">Text to analyze</label><textarea id="text" required maxlength="20000" placeholder="Type or paste your text here..."></textarea><label for="speed">Reading speed (words per minute)</label><input id="speed" type="number" min="1" max="2000" value="200" required><label><input id="frequency" type="checkbox"> Include word frequency</label><button id="run">Run analysis</button></form>
<p id="status" role="status" aria-live="polite"></p><section id="result" hidden><h2>Result</h2><pre id="output"></pre><a id="audit">View this run's audit record</a></section>
<p><small>Processing takes one second per word. Only one analysis can run at a time. Progress, inputs, and output are saved.</small></p><a href="/history">View audit history</a></main>
<script>
const form=document.querySelector('#form'),button=document.querySelector('#run'),status=document.querySelector('#status');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='Starting analysis…';try{const response=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#text').value,words_per_minute:Number(document.querySelector('#speed').value),include_word_frequency:document.querySelector('#frequency').checked})});const data=await response.json();if(response.status===409||response.ok){location.href='/history/'+encodeURIComponent(data.run_id);return}throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail))}catch(error){status.textContent=error.message;button.disabled=false}});
fetch('/active-run').then(r=>r.json()).then(r=>{if(r.run_id){const p=document.createElement('p'),a=document.createElement('a');p.textContent='An analysis is already running. ';a.textContent='View active run';a.href='/history/'+r.run_id;p.append(a);form.before(p)}}).catch(()=>{});
const rerun=new URLSearchParams(location.search).get('rerun');
if(rerun){button.disabled=true;status.textContent='Loading previous run…';fetch('/runs/'+encodeURIComponent(rerun)).then(async r=>{if(!r.ok)throw Error('Run could not be loaded');return r.json()}).then(r=>{const input=r.inputs&&typeof r.inputs==='object'?r.inputs:{};document.querySelector('#text').value=typeof input.text==='string'?input.text:typeof r.inputs==='string'?r.inputs:'';const speed=Number(input.words_per_minute);document.querySelector('#speed').value=Number.isInteger(speed)&&speed>=1&&speed<=2000?speed:200;document.querySelector('#frequency').checked=input.include_word_frequency===true;status.textContent='Previous input loaded. Review it and run again to create a new audit record.'}).catch(e=>status.textContent=e.message).finally(()=>button.disabled=false)}
</script></html>
