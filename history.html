<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run history · Text Analyzer</title>
<style>body{font:16px system-ui;background:#f3f6fa;color:#192636;max-width:1100px;margin:35px auto;padding:0 20px}a{color:#155bc6}header{display:flex;justify-content:space-between;align-items:center}main{background:white;padding:24px;border-radius:14px}h1{margin:20px 0}form{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px;font-size:14px}input,select,button{font:inherit;padding:9px;border:1px solid #aeb9c7;border-radius:6px}button,.primary{background:#155bc6;color:white;cursor:pointer;border:0;padding:10px 18px;border-radius:6px;text-decoration:none}button:disabled{opacity:.4;cursor:default}table{border-collapse:collapse;width:100%;margin-top:22px;text-align:left}th,td{padding:13px 10px;border-bottom:1px solid #e0e5ec;vertical-align:top}th{font-size:13px;color:#526173}td.preview{max-width:330px;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:13px;background:#e0f4e7;color:#176538}.bad{background:#ffe9e7;color:#a72828}.muted{color:#526173;font-size:14px}.pager{display:flex;gap:14px;align-items:center;margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5fa;padding:18px;border-radius:8px}.stats{display:flex;gap:30px;flex-wrap:wrap;background:#f1f5fa;padding:20px;border-radius:8px}.stats strong{display:block;font-size:25px}.scroll{overflow:auto}dl{display:grid;grid-template-columns:150px 1fr;gap:12px}dd{margin:0;overflow-wrap:anywhere}h2{margin-top:30px}#message{margin:18px 0}details{margin-top:24px}summary{cursor:pointer}</style>
<header><a href="/">← Text Analyzer</a><span class="muted">Persistent audit trail</span></header><h1 id="title">Run history</h1><main>
<section id="list"><form id="filters"><label>Search input or output<input id="q" type="search" placeholder="Search text…" maxlength="200"></label><label>Status<select id="status"><option value="">All statuses</option><option value="running">Running</option><option value="interrupted">Interrupted</option><option value="success">Success</option><option value="validation_error">Invalid input</option><option value="error">Error</option></select></label><label>From (UTC)<input type="date" id="from"></label><label>Through (UTC)<input type="date" id="to"></label><button>Apply filters</button><a href="/history">Clear</a></form><div class="scroll"><table><thead><tr><th>Time</th><th>Status</th><th>Input</th><th>Words</th><th>Duration</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev">Previous</button><span id="page" class="muted"></span><button id="next">Next</button></div></section>
<section id="detail" hidden><a id="back">← Back to history</a><p id="meta"></p><div id="stats" class="stats"></div><section id="live"><h2>Progress log</h2><progress id="progress" max="1" value="0" style="width:100%"></progress><p id="progressText" role="status" aria-live="polite"></p><pre id="events" style="max-height:300px;overflow:auto"></pre><p id="connection" class="muted"></p></section><h2>Input text</h2><pre id="input"></pre><h2>Options used</h2><dl id="options"></dl><h2 id="outputTitle">Output</h2><pre id="output"></pre><a id="again" class="primary">Run again</a><details><summary>Technical details</summary><dl id="technical"></dl><a id="raw" target="_blank">View raw JSON</a></details></section><p id="message" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search), run=location.pathname.split('/')[2];
const labels={success:'Success',validation_error:'Invalid input',error:'Error',running:'Running',interrupted:'Interrupted'};
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function pair(target,key,value){target.append(node('dt',key),node('dd',String(value)))}
function date(value){return new Date(value).toLocaleString()}
async function get(url){const r=await fetch(url);const body=await r.json();if(!r.ok)throw Error(typeof body.detail==='string'?body.detail:'Could not load records');return body}
async function history(){for(const key of ['q','status','from','to'])$(key).value=params.get(key)||'';const offset=Math.max(0,Number(params.get('offset'))||0),query=new URLSearchParams(params);query.set('limit','20');query.set('offset',offset);const data=await get('/runs?'+query);for(const r of data.runs){const row=document.createElement('tr'),cell=document.createElement('td'),link=node('a',date(r.timestamp));link.href='/history/'+r.id+'?'+params;cell.append(link);row.append(cell);const status=document.createElement('td');status.append(node('span',labels[r.status]||r.status,'badge'+(r.status==='success'?'':' bad')));row.append(status);const input=typeof r.inputs==='object'&&r.inputs!==null?r.inputs.text: r.inputs;row.append(node('td',String(input??'(No text)').slice(0,120),'preview'),node('td',r.output.word_count??'—'),node('td',r.duration_ms+' ms'));$('rows').append(row)}$('page').textContent=data.total? (offset+1)+'–'+(offset+data.runs.length)+' of '+data.total+' runs':'0 runs';$('prev').disabled=offset===0;$('next').disabled=offset+20>=data.total;for(const [id,delta] of [['prev',-20],['next',20]])$(id).onclick=()=>{const p=new URLSearchParams(params);p.set('offset',Math.max(0,offset+delta));location.href='/history?'+p};if(!data.runs.length)$('message').textContent='No runs match these filters.'}
$('filters').onsubmit=e=>{e.preventDefault();if($('from').value&&$('to').value&&$('from').value>$('to').value){$('message').textContent='From date must be on or before Through date.';return}const p=new URLSearchParams();for(const key of ['q','status','from','to'])if($(key).value)p.set(key,$(key).value);location.href='/history?'+p};
async function detail(){for(const id of ['meta','stats','options','technical'])$(id).replaceChildren();const r=await get('/runs/'+encodeURIComponent(run));$('title').textContent='Run details';$('list').hidden=true;$('detail').hidden=false;$('back').href='/history?'+params;$('meta').append(node('span',labels[r.status]||r.status,'badge'+(r.status==='success'?'':' bad')),document.createTextNode(' · '+date(r.timestamp)));const inputs=r.inputs&&typeof r.inputs==='object'?r.inputs:{};$('input').textContent=inputs.text??(typeof r.inputs==='string'?r.inputs:JSON.stringify(r.inputs,null,2));pair($('options'),'Reading speed',inputs.words_per_minute===undefined?'Not supplied':inputs.words_per_minute+' words/min');pair($('options'),'Word frequency',inputs.include_word_frequency===undefined?'Not supplied':inputs.include_word_frequency?'Included':'Off');if(r.status==='success'){$('stats').hidden=false;for(const [label,value] of [['Words',r.output.word_count],['Characters',r.output.character_count],['Reading time',r.output.reading_time_seconds+' sec']]){const div=document.createElement('div');div.append(node('strong',value),node('span',label));$('stats').append(div)}$('output').textContent=r.output.word_frequency?Object.entries(r.output.word_frequency).map(([w,n])=>w+': '+n).join('\n'):'Word frequency was not requested.';$('outputTitle').textContent='Word frequency'}else{$('stats').hidden=true;$('outputTitle').textContent='Error details';$('output').textContent=r.output.detail? (Array.isArray(r.output.detail)?r.output.detail.map(e=>(e.loc||[]).join(' → ')+': '+e.msg).join('\n'):String(r.output.detail)):r.output.error||JSON.stringify(r.output,null,2)}pair($('technical'),'Run ID',r.id);pair($('technical'),'Timestamp (UTC)',r.timestamp);pair($('technical'),'Duration',r.duration_ms+' ms');$('raw').href='/runs/'+r.id;$('again').href='/?rerun='+r.id;$('again').hidden=r.status==='running';if(r.status==='running'){$('outputTitle').textContent='Output';$('output').textContent='The final report will appear here when processing completes.'}}
function watch(){const stream=new EventSource('/runs/'+encodeURIComponent(run)+'/events');let seen=0;stream.onopen=()=>{$('connection').textContent='Connected to progress stream'};stream.onmessage=e=>{const event=JSON.parse(e.data);if(event.sequence<=seen)return;seen=event.sequence;const line=document.createTextNode(new Date(event.timestamp).toLocaleTimeString()+' · '+event.message+'\n');$('events').append(line);$('events').scrollTop=$('events').scrollHeight;if(event.total!==undefined){$('progress').max=Math.max(1,event.total);$('progress').value=event.processed;$('progressText').textContent=event.processed+' of '+event.total+' words · '+event.message}else{$('progressText').textContent=event.message}};stream.addEventListener('done',e=>{stream.close();const status=JSON.parse(e.data).status;$('connection').textContent='Saved progress log · '+(labels[status]||status);if(status==='success')$('progress').value=$('progress').max;detail().catch(e=>$('message').textContent=e.message)});stream.onerror=()=>{$('connection').textContent='Connection lost. Reconnecting automatically…'}}
(run?detail().then(watch):history()).catch(e=>{$('message').textContent=e.message});
</script></html>
